<div class="captcha-container">
  <h2>CAPTCHA Challenge</h2>

  <div *ngIf="currentChallenge" [@fadeAnimation]="currentStage$ | async">
    <!-- SVG CAPTCHA Display -->
    <div class="captcha-display">
      <svg
        [attr.width]="svgWidth"
        [attr.height]="svgHeight"
        [style.background-color]="svgBackgroundColor"
        style="border: 1px solid #ccc"
      >
        <!-- Background noise -->
        <ng-container *ngFor="let noise of svgNoises">
          <line
            *ngIf="noise.type === 'line'"
            [attr.x1]="noise.x1"
            [attr.y1]="noise.y1"
            [attr.x2]="noise.x2"
            [attr.y2]="noise.y2"
            [attr.stroke]="noise.stroke"
            stroke-width="1"
          />
        </ng-container>

        <!-- Characters -->
        <ng-container *ngFor="let charData of svgChars">
          <text
            [attr.x]="charData.x"
            [attr.y]="charData.y"
            [attr.fill]="charData.color"
            [attr.transform]="
              'rotate(' + charData.rotate + ' ' + charData.x + ' ' + charData.y + ')'
            "
            [attr.font-size]="charData.fontSize"
            [attr.stroke]="charData.stroke"
            font-weight="bold"
            font-family="Arial, sans-serif"
            stroke-width="0.5"
          >
            {{ charData.char }}
          </text>
        </ng-container>
      </svg>
    </div>

    <!-- Reactive Form -->
    <form [formGroup]="answerForm" (ngSubmit)="submitAnswer()">
      <input
        type="text"
        formControlName="answer"
        (ngModelChange)="selectAnswer($event)"
        placeholder="Your answer"
        [class.error-input]="submitted && answerForm.invalid"
      />

      <!-- Validation Messages -->
      <p *ngIf="submitted && answerForm.get('answer')?.hasError('required')" class="error">
        Answer is required
      </p>
      <p *ngIf="error" class="error">{{ error }}</p>
      <p *ngIf="currentChallenge.isCompleted" class="success">
        ✓ Correct! You can proceed to the next challenge.
      </p>

      <!-- Navigation Buttons -->
      <div class="navigation-buttons">
        <button type="button" (click)="previousStage()" [disabled]="(currentStage$ | async) === 0">
          Previous
        </button>

        <button type="submit" [disabled]="currentChallenge.isCompleted">Submit</button>

        <button
          type="button"
          (click)="nextStage()"
          [disabled]="
            !currentChallenge.isCompleted ||
            (currentStage$ | async) === ((challenges$ | async)?.length || 0) - 1
          "
        >
          Next
        </button>
      </div>
    </form>

    <!-- Finish Button -->
    <div *ngIf="captchaState.areAllChallengesCompleted()">
      <p class="success">All challenges completed!</p>
      <button (click)="finish()">Go to Results</button>
    </div>
  </div>
</div>
